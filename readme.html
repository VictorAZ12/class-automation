# Uplus Schedule Process Tool 使用说明书（28 Apr 2025）

## 概述

Uplus Schedule Process Tool 是一个基于 Google Apps Script 开发的工具，用于从 Google Sheets 中提取课程数据，生成校区和教师的课表，并将结果保存到 Google Drive 中指定文件夹。工具支持多校区数据处理、时间冲突检测以及动态文件夹选择功能。

## 系统要求

- **Google 账号**：需要登录 Google 账号以访问 Google Sheets 和 Google Drive。
- **浏览器**：支持现代浏览器（如 Chrome、Firefox 等）。
- **权限**：工具需要访问用户的 Google Drive 和 Google Sheets 数据，用户需授权相关权限。

---

## 功能特点

1. **多校区支持**：可同时处理多个校区的 Google Sheets 数据。
2. **动态输入**：支持动态添加或删除 Google Sheets 链接和校区名称输入框。
3. **文件夹选择**：允许用户选择 Google Drive 中的文件夹来保存生成的课表文件。
4. **课表生成**：
   - **校区课表**：按教室和时间生成校区每日课表。
   - **教师课表**：按教师生成个人周课表，支持时间冲突检测。
5. **数据验证**：通过内置的 Validate App Script 检查课程数据是否符合要求。
6. **结果展示**：提供处理日志和直接跳转到输出文件夹的功能。
7. **加载动画**：在处理数据时显示加载动画，提升用户体验。

## 使用步骤

### 1. 获取并准备 Google Sheets 模板

1. **获取模板**：使用我们提供的 [Google Sheets 模板](https://docs.google.com/spreadsheets/d/1LQCNQ-I3BA3C4Tq-qMtzP3Wh3XsNpIGQr6Kj5F1RhYM/)。
2. **创建副本**：
   - 打开模板后，点击 **文件 > 制作副本**。
   - 将副本保存到您自己的 Google Drive 中。
   - **注意**：模板中包含一个名为 \`Validate\` 的 App Script，用于验证课程数据。必须创建副本才能获取此脚本，否则无法使用验证功能。
3. **填充数据**：按照模板的结构填写数据（详见下文）。

#### 模板结构说明

模板包含以下工作表：

- **Control 表**：
  - 包含以下字段：
    - \`Flag\` | \`Value\`
    - \`generateTeacherSchedule?\` | \`Yes\` 或 \`No\`（是否生成教师课表）
    - \`generateCampusSchedule?\` | \`Yes\` 或 \`No\`（是否生成校区课表）
- **Course Data 表**：
  - 包含以下字段：
    - \`Validation\`, \`Weekday\`, \`Start Time\`, \`End Time\`, \`Room\`, \`Teacher\`, \`Course Name\`, \`Course Type\`, \`Student Count\`, \`Students\`, \`Notes\`
  - \`Validation\` 列会调用 \`Validate\` App Script 自动验证数据，输出 \`OK\` 或错误信息。
  - \`Weekday\` 需为 \`Monday\` 到 \`Sunday\` 之一。
  - \`Start Time\` 和 \`End Time\` 格式为 \`HH:MM\`（如 \`09:00\`）。
- **Teacher Data 表**（仅在生成教师课表时需要）：
  - 包含以下字段：
    - \`Teacher\`, \`Email\`, \`NeedUpdate?\`
  - \`NeedUpdate?\` 设置为 \`Yes\` 表示需要为该教师生成课表。

### 2. 填写表内数据验证

模板中的 \`Course Data\` 表第一列（\`Validation\`）会调用 \`Validate\` App Script 自动验证每行数据。以下是其作用和输出：

#### Validate App Script 的作用
\`Validate\` 是一个自定义函数，用于检查 \`Course Data\` 表中的课程数据是否符合要求，主要验证以下两点：
1. **时间冲突（同一教室）**：在相同的 \`Weekday\` 和 \`Room\` 下，检查课程时间段是否重叠（如果一个课程的开始时间等于另一个课程的结束时间，不算冲突）。
2. **教师冲突**：在相同的 \`Weekday\` 下，检查同一教师是否在同一时间段被分配到不同课程（即使教室不同）。

#### Validate 的输出
- **\`OK\`**：表示当前行的数据没有冲突或错误，可以正常生成课表。
- **错误信息**：如果数据有问题，\`Validation\` 列会显示详细的错误信息，例如：
  - \`错误：Weekday 为空\`：\`Weekday\` 字段为空。
  - \`错误：开始时间为空\`：\`Start Time\` 字段为空。
  - \`错误：时间格式无效（需为 hh:mm): 9:00\`：\`Start Time\` 或 \`End Time\` 格式不正确（需为 \`HH:MM\`）。
  - \`错误：开始时间 (09:00) 必须早于结束时间 (08:00)\`：开始时间晚于或等于结束时间。
  - \`冲突：与第 2 行（Monday, RoomA, 09:00-10:00）时间重叠\`：同一 \`Weekday\` 和 \`Room\` 下，当前课程时间与第 2 行课程时间重叠。
  - \`教师冲突：John 在第 3 行（Monday, RoomB, 10:00-11:00）与当前课程时间重叠\`：同一 \`Weekday\` 下，教师 \`John\` 在第 3 行的时间段与当前课程时间冲突。

#### 使用建议
- 在填充 \`Course Data\` 表后，检查 \`Validation\` 列，确保所有行都显示 \`OK\`。
- 如果出现错误信息，根据提示修改数据（例如调整时间、教室或教师分配），然后重新验证。


### 3. 本工具使用说明

1. 在页面上方的输入框中：
   - **Sheet Link**：输入 Google Sheets 副本的链接（确保链接可访问）。
   - **Campus Name**：输入校区名称（用于命名生成的课表文件）。
2. 如需处理多个校区，点击 **Add** 按钮添加更多输入框。
3. 如需删除最后一组输入框，点击 **Delete** 按钮（至少保留一组输入框）。

### 5. 选择输出文件夹

1. 在页面中部的文件夹选择区域，浏览 Google Drive 中的文件夹。
   - 点击文件夹名称选择该文件夹（高亮显示）。
   - 点击 **Up** 按钮返回上一级文件夹。
2. 选择目标文件夹后，点击 **Confirm Selection** 确认选择。
   - 确认后会显示提示：\`Folder selected: [文件夹路径]\`。

### 6. 处理数据

1. 点击页面底部的 **Process** 按钮开始处理。
2. 工具会验证输入并开始处理：
   - 如果输入不完整（缺少链接、校区名称或未选择文件夹），会弹出提示。
   - 处理期间会显示加载动画。

### 7. 查看结果

1. 处理完成后，会弹出一个模态框显示处理日志：
   - 日志包括成功、失败、跳过和警告信息。
   - 示例：
     \`\`\`
     处理了 2 个校区表格：1 个成功，0 个失败，1 个跳过，0 个警告。
     处理详情：

     - LIS (跳过): 因为 Control flag 均不是 Yes，跳过校区 LIS 的处理。

     \`\`\`
2. 点击 **打开输出文件夹** 按钮可跳转到 Google Drive 中的目标文件夹查看生成的课表文件。
3. 点击 **关闭** 按钮关闭模态框。

## 程序对错误数据的处理

工具在处理数据时会对 \`Course Data\` 表中的数据进行额外的验证，并针对错误数据采取以下措施：

### 1. Weekday 无效
- **情况**：\`Weekday\` 字段为空或不是 \`Monday\` 到 \`Sunday\` 之一（例如输入了 \`Mon\` 或 \`monday\`）。
- **处理**：该行课程将被跳过，并记录警告日志：
  - 示例：\`校区 CampusB 的 "Course Data" 表第 2 行 weekday 无效：Mon，该课程未加入校区课表。\`

### 2. 时间格式错误
- **情况**：\`Start Time\` 或 \`End Time\` 为空、格式不正确（需为 \`HH:MM\`，如 \`09:00\`），或时间无法解析。
- **处理**：该行课程将被跳过，并记录警告日志：
  - 示例：\`校区 CampusA 的 "Course Data" 表第 3 行时间格式无效：开始时间=9:00，结束时间=10:00，该课程未加入校区课表。\`

### 3. 开始时间晚于或等于结束时间
- **情况**：\`Start Time\` 晚于或等于 \`End Time\`（例如 \`10:00-09:00\` 或 \`09:00-09:00\`）。
- **处理**：该行课程将被跳过，并记录警告日志：
  - 示例：\`校区 CampusA 的 "Course Data" 表第 4 行结束时间早于或等于开始时间：开始时间=10:00，结束时间=09:00，该课程未加入校区课表。\`

### 4. 课程时间过长
- **情况**：课程持续时间超过 3 小时（例如 \`09:00-13:00\`）。
- **处理**：该行课程仍会被处理，但会记录警告日志：
  - 示例：\`校区 CampusA 的 "Course Data" 表第 5 行课程时间过长：4.00 小时\`

### 5. 教室为空
- **情况**：\`Room\` 字段为空。
- **处理**：该行课程将被跳过，并记录警告日志：
  - 示例：\`校区 CampusA 的 "Course Data" 表第 6 行 Room 为空，该课程未加入校区课表。\`

### 6. 教师未找到
- **情况**：生成教师课表时，\`Course Data\` 表中的教师未在 \`Teacher Data\` 表中找到。
- **处理**：该教师的相关课程将被跳过，并记录警告日志：
  - 示例：\`校区 CampusB 的 "Course Data" 表 表第 3 行教师 John 未在 "Teacher Data" 表中找到，未加入课表。\`

### 7. 教师时间冲突
- **情况**：同一教师在同一 \`Weekday\` 下的多个课程时间重叠（即使教室不同）。
- **处理**：该教师的课表将不会生成，并记录错误日志：
  - 示例：\`无法为教师 john@example.com(John) 生成课表：在 Monday, CampusA 的课程 Math(09:00-10:00）与 CampusB 的课程 Science(09:30-10:30）时间冲突\`

### 8. 缺少必要表或字段
- **情况**：Google Sheets 缺少 \`Control\`、\`Course Data\` 或 \`Teacher Data\` 表，或表中缺少必要字段。
- **处理**：该校区的处理将被中止，并记录错误日志：
  - 示例：\`校区 CampusA 缺少 "Course Data" 表，无法生成校区课表。\`
  - 示例：\`校区 CampusB 的 "Course Data" 表缺少必要表头：Room, Teacher\`

## 课程开始和结束时间的考量

工具在处理课程时间时有以下考量：

### 1. 时间格式和范围
- **格式**：\`Start Time\` 和 \`End Time\` 必须为 \`HH:MM\` 格式（例如 \`09:00\`），且小时在 00-23 之间，分钟在 00-59 之间。
- **处理**：如果时间格式无效（例如 \`9:00\` 或 \`25:00\`），该行课程将被跳过，并记录警告日志。

### 2. 时间冲突（Validate 检查）
- 如前所述，\`Validate\` App Script 会在 \`Course Data\` 表中检查时间冲突：
  - 同一 \`Weekday\` 和 \`Room\` 下，时间段不得重叠（除非一个课程的开始时间等于另一个课程的结束时间）。
  - 同一 \`Weekday\` 下，同一教师不得在重叠的时间段内被分配到不同课程。

### 3. 时间范围的动态调整
- 工具会根据所有课程的 \`Start Time\` 和 \`End Time\` 自动确定课表的时间范围：
  - 最小时间：所有课程中最早的开始时间，向下取整到最近的 15 分钟（例如 \`09:07\` 取整为 \`09:00\`）。
  - 最大时间：所有课程中最晚的结束时间，向上取整到最近的 15 分钟（例如 \`16:53\` 取整为 \`17:00\`）。
- 课表将以 15 分钟为间隔显示时间槽（例如 \`09:00\`, \`09:15\`, \`09:30\`）。

### 4. 课程持续时间限制
- 如果课程持续时间超过 3 小时（例如 \`09:00-13:00\`），工具会记录警告日志，但仍会生成课表。
- 建议用户检查课程时间是否合理，避免安排过长的课程。

### 5. 时间冲突（教师课表）
- 在生成教师课表时，工具会再次检查时间冲突：
  - 如果同一教师在同一 \`Weekday\` 下的课程时间重叠（除非开始时间等于结束时间），该教师的课表将不会生成，并记录错误日志。

## 生成的文件

- **校区课表**：
  - 文件名格式：\`[校区名称]_Timetable_[时间戳].gsheet\`
  - 包含多个工作表（按星期一到星期日），每个工作表按时间和教室展示课程信息。
- **教师课表**：
  - 文件名格式：\`[教师邮箱]'s Weekly Schedule ([时间戳]).gsheet\`
  - 包含一个工作表，按时间和星期展示教师的课程安排。

## 注意事项

1. **模板副本**：
   - 必须创建模板的副本并保存到自己的 Google Drive 中，否则无法使用 \`Validate\` App Script。
2. **输入格式**：
   - Google Sheets 链接必须有效且用户有访问权限。
   - 时间格式需为 \`HH:MM\`，否则可能导致课程数据被跳过。
3. **时间冲突**：
   - 使用 \`Validate\` App Script 检查数据，确保 \`Course Data\` 表中没有时间或教师冲突。
   - 工具在生成教师课表时也会检测时间冲突，若存在冲突，则不会生成该教师的课表，并记录错误日志。
4. **权限问题**：
   - 确保 Google Sheets 和 Google Drive 文件夹的权限设置正确，否则可能导致处理失败。
5. **数据量限制**：
   - 大量数据可能导致处理时间较长，建议分批处理。

## 常见问题

1. **为什么处理失败？**
   - 检查 Google Sheets 链接是否有效。
   - 确保 Google Sheets 中包含必要的表和字段。
   - 查看日志中的错误信息，可能有时间格式错误或缺少必要数据。
2. **为什么某些课程未加入课表？**
   - 检查 \`Weekday\` 是否为有效值（\`Monday\` 到 \`Sunday\`）。
   - 确保 \`Start Time\` 和 \`End Time\` 格式正确且结束时间晚于开始时间。
   - 检查 \`Validation\` 列是否显示 \`OK\`，如果有错误信息，需根据提示修改数据。
3. **为什么教师课表未生成？**
   - 检查 \`Teacher Data\` 表中是否包含该教师的信息。
   - 检查是否存在时间冲突（\`Validate\` 列可能已提示教师冲突）。
4. **如何查看生成的课表？**
   - 在结果模态框中点击 **打开输出文件夹**，即可在 Google Drive 中查看生成的文件。
