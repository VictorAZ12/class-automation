<!-- Separated client-side javascript https://developers.google.com/apps-script/guides/html/best-practices -->
<script>
  // clientScript.html
  // This file contains the JavaScript code that handles user interactions for the Google Sheets processor.
  let selectedOutputFolderId = null;
  let selectedSheetLink = null;
  let currentFolderId = null;
  let selectedFolderId = null;
  let duplicateFolderId = null;
  let duplicateFolderPath = null;
  let selectedFolderName = null;
  let loadingCalls = 0;
  let inputGroupCount = 1; // 跟踪输入框组数量，初始为 1

  function checkIfLoadingComplete() {
    loadingCalls++;
    if (loadingCalls === 2) {
      $("#loading").hide();
      $("#folders").show();
      $('#confirmSelectBtn').show();
      loadingCalls = 0;
    }
  }

  function listFolders() {
    $("#folders").hide();
    $('#confirmSelectBtn').hide();
    $("#loading").show();
    google.script.run.withSuccessHandler(displayFolders).getFoldersInFolder(currentFolderId);
    google.script.run.withSuccessHandler(displayPath).getFolderPath(currentFolderId);
  }

  function displayFolders(folderList) {
    let folderListParsed = JSON.parse(folderList);
    let folderContainer = $("#folders");
    folderContainer.empty();
    folderListParsed.forEach(function(folder) {
      folderContainer.append(
        `<li id='${folder.id}' class="list-group-item" onclick="navigateFolder('${folder.id}', this, event)">${folder.name}</li>`
      );
    });
    checkIfLoadingComplete();
  }

  function displayPath(pathList) {
    pathList = JSON.parse(pathList);
    let pathContainer = $("#path");
    pathContainer.empty();
    let pathStr = pathList.map(folder => folder.name).join("/");
    pathContainer.text(pathStr);
    checkIfLoadingComplete();
  }

  function navigateFolder(folderId, element, event) {
    if (selectedFolderId === folderId) {
      currentFolderId = folderId;
      selectedFolderId = null;
      $("#selectedFolder").text("");
      listFolders();
    } else {
      selectedFolderId = folderId;
      console.log("Selected folder ID:", selectedFolderId);
      selectedOutputFolderId = folderId;
      $("#folders .list-group-item").removeClass('active');
      $(element).addClass("active");
      google.script.run.withSuccessHandler(function(pathStr) {
           $("#selectedFolder").text("Selected folder: " + pathStr);
           selectedFolderName = pathStr;
      }).getFolderPathString(folderId);
      console.log("Selected folder name:", selectedFolderName);
      $('#confirmSelectBtn').show();
    }
  }

  function navigateUp() {
    console.log("navigateUp called. currentFolderId:", currentFolderId);
    if (currentFolderId) {
      if (duplicateFolderId && duplicateFolderId === currentFolderId) {
        console.log("Cannot navigate up from the duplicate folder root.");
        return;
      }
      $("#folders").hide();
      $('#confirmSelectBtn').hide();
      $("#loading").show();
      selectedFolderId = null;
      $("#selectedFolder").text("");
      console.log("Calling google.script.run.getFolderPath for:", currentFolderId);
      google.script.run.withSuccessHandler(function(pathList) {
        console.log("getFolderPath success handler received:", pathList);
        pathList = JSON.parse(pathList);
        if (pathList.length > 1) {
          let pathStr = pathList.map(folder => folder.name).join("/");
          console.log("Current path string:", pathStr);
          if (duplicateFolderId){
            console.log("Checking duplicate folder condition. duplicateFolderPath:", duplicateFolderPath);
            if (pathStr.indexOf(duplicateFolderPath) < 0){
              console.log("Path is outside duplicate folder path. Navigating back into duplicate folder:", duplicateFolderId);
              currentFolderId = duplicateFolderId;
              listFolders();
              return;
            }
          }
          currentFolderId = pathList[pathList.length - 2].id;
          console.log("Navigating up to parent folder:", currentFolderId);
          listFolders();
        } else {
          console.log("Path list length is not greater than 1. Cannot navigate up further.");
          $("#folders").show();
          $('#confirmSelectBtn').hide();
          $("#loading").hide();
        }
      }).getFolderPath(currentFolderId);
    } else {
      console.log("navigateUp called but currentFolderId is null or empty (already at root).");
    }
  }

  // 新增：添加一组输入框
  function addInputGroup() {
    inputGroupCount++;
    const inputGroups = $("#inputGroups");
    const newGroup = `
      <div class="input-group mb-3" data-index="${inputGroupCount}">
          <div class="row w-100">
              <div class="col-md-6">
                  <label for="sheetLink${inputGroupCount}">Sheet Link ${inputGroupCount}:</label>
                  <input type="text" id="sheetLink${inputGroupCount}" class="form-control" placeholder="Enter Google Sheets link" required>
              </div>
              <div class="col-md-6">
                  <label for="campusName${inputGroupCount}">Campus Name ${inputGroupCount}:</label>
                  <input type="text" id="campusName${inputGroupCount}" class="form-control" placeholder="Enter campus name" required>
              </div>
          </div>
      </div>`;
    inputGroups.append(newGroup);
  }

  // 新增：删除最后一组输入框
  function deleteInputGroup() {
    if (inputGroupCount > 1) {
      $(`#inputGroups .input-group[data-index="${inputGroupCount}"]`).remove();
      inputGroupCount--;
    } else {
      alert("至少需要保留一组输入框！");
    }
  }

  // 修改：处理多个 Google Sheets 链接和校区名称
  function processSheet() {
    const inputGroups = $("#inputGroups .input-group");
    const sheetData = [];
    let hasValidInput = false;

    inputGroups.each(function() {
      const index = $(this).data("index");
      const sheetLink = $(`#sheetLink${index}`).val();
      const campusName = $(`#campusName${index}`).val();

      if (sheetLink && campusName) {
        sheetData.push({ sheetLink, campusName });
        hasValidInput = true;
      }
    });

    if (hasValidInput && selectedOutputFolderId) {
      console.log("Processing sheets:", sheetData);
      google.script.run.withSuccessHandler((res) => {
        const response = JSON.parse(res);
        console.log(response.details ? response.message + '\n' + response.details);
        alert(response.details ? response.message + '\n' + response.details);
      }).processSheetData(selectedOutputFolderId, sheetData);
    } else {
      alert("请确保至少填写一组有效的 Google Sheets 链接和校区名称，并选择一个输出文件夹！");
    }
  }

  $(document).ready(function() {
    listFolders();
    $("#promptMessage").text("Select a folder to save results");
    $('#confirmSelectBtn').on('click', confirmOutputFolderSelection);
    $('#confirmSelectBtn').hide();
  });

  function confirmOutputFolderSelection() {
    if (selectedOutputFolderId) {
      console.log("Confirmed selection. Output Folder Id", selectedOutputFolderId);
      alert("Folder selected: " + selectedFolderName);
    } else {
      alert("Please select a folder first.");
    }
  }
</script>
