<body>
    <div class="container">
        <h1>(In dev) Uplus Schedule Process Tool</h1>
        <div id="inputGroups" class="input-groups">
            <!-- 初始输入框组 -->
            <div class="input-group mb-3" data-index="1">
                <div class="row w-100">
                    <div class="col-md-6">
                        <label for="sheetLink1">Sheet Link 1:</label>
                        <input type="text" id="sheetLink1" class="form-control" placeholder="Enter Google Sheets link" required>
                    </div>
                    <div class="col-md-6">
                        <label for="campusName1">Campus Name 1:</label>
                        <input type="text" id="campusName1" class="form-control" placeholder="Enter campus name" required>

                </div>
            </div>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary me-2" onclick="addInputGroup()">Add</button>

        <div id="folderSelectContainer" class="container">
            <h2 id="promptMessage"></h2>
            <div class="mb-3">
              <button class="btn btn-primary" onclick="navigateUp()">Up</button>
            </div>
            <div id="path" class="mb-3"></div>
            <div id="loading">Loading...</div>
            <ul id="folders" class="list-group"></ul>
            <div class="mt-3">
              <div id="selectedFolder" class="mb-3"></div>
              <button id="confirmSelectBtn" class="btn btn-success">Confirm Selection</button>
            </div>
        </div>
        <button id="processButton" class="btn btn-primary" onclick="processSheet()">Process</button>
    </div>
